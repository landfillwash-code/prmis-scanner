<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PRMIS Live Camera Scanner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .scanner-header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 16px;
    }
    .scanner-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }
    #reader {
      width: 100% !important;
      max-width: 500px;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 8px;
    }
    .reticle-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 180px;
      border: 2px solid rgba(59, 130, 246, 0.8);
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
    }
    .reticle-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #60a5fa;
      border-style: solid;
      pointer-events: none;
    }
    .reticle-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
    .reticle-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
    .reticle-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
    .reticle-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }
    .scan-laser {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: scanLaser 2s infinite ease-in-out;
    }
    @keyframes scanLaser {
      0% { top: 10%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 10%; opacity: 0.8; }
    }
    .scanner-footer {
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 14px 16px;
    }
    .card-preview {
      word-break: break-all;
      font-family: monospace;
      font-size: 0.8rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      max-height: 80px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- Scanner Header -->
  <div class="scanner-header d-flex justify-content-between align-items-center">
    <div>
      <div class="fw-bold fs-6 text-white d-flex align-items-center gap-2">
        <i class="bi bi-camera-fill text-primary"></i> PRMIS Live Scanner
      </div>
      <div class="small text-secondary" style="font-size: 0.72rem;">Standalone HTTPS Camera Component</div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button id="btnSwitchCamera" class="btn btn-sm btn-outline-light" title="Switch Camera" onclick="switchCamera()">
        <i class="bi bi-camera-reels"></i>
      </button>
      <button id="btnClose" class="btn btn-sm btn-outline-danger" title="Close Scanner" onclick="closeScanner()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <!-- Camera Viewport -->
  <div class="scanner-container">
    <div id="reader"></div>

    <!-- Reticle Guide -->
    <div class="reticle-overlay" id="reticle">
      <div class="reticle-corner reticle-tl"></div>
      <div class="reticle-corner reticle-tr"></div>
      <div class="reticle-corner reticle-bl"></div>
      <div class="reticle-corner reticle-br"></div>
      <div class="scan-laser"></div>
    </div>

    <!-- Status message badge -->
    <div id="statusBadge" class="position-absolute bottom-0 mb-3 px-3 py-1 rounded-pill bg-dark bg-opacity-75 text-white small border border-secondary" style="font-size: 0.75rem; z-index: 10;">
      <i class="bi bi-bullseye text-warning me-1"></i> Align QR or barcode in box
    </div>
  </div>

  <!-- Footer Result & Action Area -->
  <div class="scanner-footer">
    <div id="resultContainer" style="display: none;" class="mb-2">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="badge bg-success"><i class="bi bi-check-circle-fill me-1"></i> Card Decoded</span>
        <button class="btn btn-sm text-secondary p-0" onclick="resetScan()"><i class="bi bi-arrow-clockwise"></i> Scan Again</button>
      </div>
      <div class="card-preview mb-2" id="scannedTextDisplay"></div>
    </div>

    <div class="d-flex gap-2">
      <button id="btnSend" class="btn btn-primary flex-grow-1" style="display: none;" onclick="sendDecodedValue()">
        <i class="bi bi-box-arrow-down-left me-1"></i> Send to PRMIS & Close
      </button>
      <button id="btnManualInput" class="btn btn-outline-secondary btn-sm" onclick="promptManualInput()">
        <i class="bi bi-keyboard"></i> Manual
      </button>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let currentFacingMode = "environment";
    let lastDecodedText = "";
    let isProcessing = false;

    // Initialize scanner on window load
    window.addEventListener("DOMContentLoaded", function() {
      initScanner();
    });

    function initScanner() {
      const config = {
        fps: 15,
        qrbox: { width: 280, height: 180 },
        aspectRatio: 1.0,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      };

      html5QrCode = new Html5Qrcode("reader", {
        verbose: false,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.DATA_MATRIX
        ]
      });

      startCamera(currentFacingMode);
    }

    function startCamera(facingMode) {
      const statusBadge = document.getElementById("statusBadge");
      if (statusBadge) {
        statusBadge.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Accessing camera...';
      }

      html5QrCode.start(
        { facingMode: facingMode },
        { fps: 15, qrbox: { width: 280, height: 180 } },
        onScanSuccess,
        onScanFailure
      ).then(() => {
        if (statusBadge) {
          statusBadge.innerHTML = '<i class="bi bi-record-circle-fill text-danger me-1"></i> Camera live. Hold card steady.';
        }
      }).catch(err => {
        console.error("Camera start error:", err);
        if (statusBadge) {
          statusBadge.className = "position-absolute bottom-0 mb-3 px-3 py-1 rounded-pill bg-danger text-white small";
          statusBadge.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> Camera blocked. Check browser permissions.';
        }
      });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      lastDecodedText = decodedText;

      playBeep();

      // Show result UI
      document.getElementById("resultContainer").style.display = "block";
      document.getElementById("scannedTextDisplay").textContent = decodedText;
      document.getElementById("btnSend").style.display = "inline-block";
      document.getElementById("reticle").style.display = "none";

      const statusBadge = document.getElementById("statusBadge");
      if (statusBadge) {
        statusBadge.className = "position-absolute bottom-0 mb-3 px-3 py-1 rounded-pill bg-success text-white small";
        statusBadge.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Decoded successfully!';
      }

      // Auto-send immediately to parent / opener
      sendDecodedValue();
    }

    function onScanFailure(error) {
      // Periodic frame read failure (normal)
    }

    function sendDecodedValue() {
      const payload = {
        type: "PRMIS_SCAN_RESULT",
        source: "PRMIS_LIVE_SCANNER",
        value: lastDecodedText,
        timestamp: Date.now()
      };

      let sent = false;

      // 1. Post to opener if opened in a popup window
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, "*");
        sent = true;
      }

      // 2. Post to parent if embedded in iframe
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, "*");
        sent = true;
      }

      if (sent) {
        // Automatically close popup window after sending
        setTimeout(function() {
          closeScanner();
        }, 500);
      } else {
        alert("Decoded value: " + lastDecodedText + "\n\n(No parent window found to receive message. You can copy the text.)");
      }
    }

    function resetScan() {
      lastDecodedText = "";
      isProcessing = false;
      document.getElementById("resultContainer").style.display = "none";
      document.getElementById("btnSend").style.display = "none";
      document.getElementById("reticle").style.display = "flex";
      const statusBadge = document.getElementById("statusBadge");
      if (statusBadge) {
        statusBadge.className = "position-absolute bottom-0 mb-3 px-3 py-1 rounded-pill bg-dark bg-opacity-75 text-white small border border-secondary";
        statusBadge.innerHTML = '<i class="bi bi-record-circle-fill text-danger me-1"></i> Camera live. Hold card steady.';
      }
    }

    function switchCamera() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          startCamera(currentFacingMode);
        });
      } else {
        startCamera(currentFacingMode);
      }
    }

    function closeScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          window.close();
        }).catch(() => {
          window.close();
        });
      } else {
        window.close();
      }
    }

    function promptManualInput() {
      const text = prompt("Enter or paste QR/Barcode text:");
      if (text && text.trim()) {
        lastDecodedText = text.trim();
        onScanSuccess(lastDecodedText);
      }
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio feedback not allowed without gesture", e);
      }
    }
  </script>
</body>
</html>
